name: Build and deploy Node.js app to Azure Web App - chungdo-client-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chungdo-client-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install and build
        run: |
          npm ci
          npm run build
          npm run test --if-present
      - name: Package standalone Next.js app
        run: |
          test -f .next/standalone/server.js
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          printf '%s\n' "$GITHUB_SHA" > .next/standalone/public/deployment-version.txt
          cd .next/standalone
          zip -qry "$GITHUB_WORKSPACE/node-app.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CD6BFF57F5FF4B0885174F69DD6872B4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2A30EBA93AB74874B3119FDDD249661E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B8C98A9B98324971B4CB6CB904A25640 }}
      - name: Use the prebuilt application
        run: >-
          az webapp config appsettings set
          --resource-group Terminal-ch
          --name chungdo-client-dev
          --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false
          --output none
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: chungdo-client-dev
          slot-name: Production
          package: node-app.zip
          startup-command: 'HOSTNAME=0.0.0.0 node server.js'
          clean: true
          restart: true
      - name: Verify deployed revision and page
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          test -n "$APP_URL"
          printf '%s\n' "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 30); do
            version=$(curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "${APP_URL%/}/deployment-version.txt?revision=$GITHUB_SHA" || true)
            if [ "$version" = "$GITHUB_SHA" ] &&
              curl --fail --silent --show-error --location --max-time 20 "${APP_URL%/}/" -o homepage.html &&
              grep -Fq 'Welfare Next' homepage.html; then
              printf 'Verified deployment %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'The running site does not match the deployed revision.' >&2
          exit 1
