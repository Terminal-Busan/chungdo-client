# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - chungdo-client-dev

on:
  workflow_dispatch:

concurrency:
  group: chungdo-client-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Package Next.js app
        run: zip -qry node-app.zip .next public next.config.ts tsconfig.json package.json node_modules -x ".next/cache/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: node-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CD6BFF57F5FF4B0885174F69DD6872B4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2A30EBA93AB74874B3119FDDD249661E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B8C98A9B98324971B4CB6CB904A25640 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chungdo-client-dev'
          slot-name: 'Production'
          package: node-app.zip

      - name: Verify deployment and report URL
        env:
          APP_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        run: |
          test -n "$APP_URL"
          printf '%s\n' "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors --max-time 20 "${APP_URL%/}/" -o /dev/null
